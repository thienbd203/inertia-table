# Please see the documentation for all configuration options:
# https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference

version: 2
updates:

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    cooldown:
      default-days: 1

  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    cooldown:
      default-days: 1

  - package-ecosystem: "npm"
    directory: "/"
    # vue-tsc 2 currently resolves TypeScript's legacy lib/tsc entry.
    # Upgrade TypeScript's major only with a compatible Vue toolchain.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    cooldown:
      default-days: 1
