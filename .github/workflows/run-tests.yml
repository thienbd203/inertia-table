name: run-tests

on:
  workflow_call:
  push:
    branches:
      - '**'
    paths:
      - '**.php'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml.dist'
      - 'composer.json'
  pull_request:
    paths:
      - '**.php'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml.dist'
      - 'composer.json'

concurrency:
  group: run-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: PHP quality
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Validate package metadata
        run: composer validate --strict --no-check-publish

      - name: Audit dependencies
        run: composer audit --no-interaction

      - name: Check static analysis
        run: composer analyse -- --no-progress

      - name: Check code style
        run: vendor/bin/pint --test

  compatibility:
    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }} · Inertia ${{ matrix.inertia }} · sqlite
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            laravel: '12.*'
            testbench: '10.*'
            inertia: '2.*'
          - php: '8.4'
            laravel: '12.*'
            testbench: '10.*'
            inertia: '3.*'
          - php: '8.4'
            laravel: '13.*'
            testbench: '11.*'
            inertia: '3.*'
          - php: '8.5'
            laravel: '13.*'
            testbench: '11.*'
            inertia: '3.*'

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, intl, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Select supported dependencies
        run: composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "inertiajs/inertia-laravel:${{ matrix.inertia }}" --no-interaction --no-update

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Execute tests
        run: vendor/bin/pest --ci

  database:
    name: PHP 8.4 · Laravel 13.* · ${{ matrix.database }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: mysql
            image: mysql:8.4
            port: 3306
            username: root
            password: root
            health: mysqladmin ping -h 127.0.0.1 -uroot -proot --silent
          - database: pgsql
            image: postgres:16
            port: 5432
            username: postgres
            password: postgres
            health: pg_isready -U postgres -d inertia_table

    services:
      database:
        image: ${{ matrix.image }}
        env:
          MYSQL_DATABASE: inertia_table
          MYSQL_ROOT_PASSWORD: root
          POSTGRES_DB: inertia_table
          POSTGRES_PASSWORD: postgres
        ports:
          - '${{ matrix.port }}:${{ matrix.port }}'
        options: >-
          --health-cmd="${{ matrix.health }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_CONNECTION: ${{ matrix.database }}
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.port }}
      DB_DATABASE: inertia_table
      DB_USERNAME: ${{ matrix.username }}
      DB_PASSWORD: ${{ matrix.password }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_mysql, pdo_pgsql, bcmath, intl, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Select supported dependencies
        run: composer require "laravel/framework:13.*" "orchestra/testbench:11.*" "inertiajs/inertia-laravel:3.*" --no-interaction --no-update

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction --no-progress

      - name: Execute tests
        run: vendor/bin/pest --ci
