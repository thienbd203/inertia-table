name: run-js-tests

on:
  push:
    paths:
      - 'resources/js/**'
      - 'tests-js/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - '.github/workflows/run-js-tests.yml'
  pull_request:
    paths:
      - 'resources/js/**'
      - 'tests-js/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - '.github/workflows/run-js-tests.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: '20.19.0'
            inertia: '^2.0.0'
            vue: '~3.4.0'
          - node: '20.19.0'
            inertia: '^3.0.0'
            vue: '^3.5.0'
          - node: '22.12.0'
            inertia: '^2.0.0'
            vue: '^3.5.0'
          - node: '22.12.0'
            inertia: '^3.0.0'
            vue: '~3.4.0'

    name: Node ${{ matrix.node }} · Inertia ${{ matrix.inertia }} · Vue ${{ matrix.vue }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install supported peer versions
        run: npm install --no-save --package-lock=false "@inertiajs/vue3:${{ matrix.inertia }}" "@vue/compiler-sfc:${{ matrix.vue }}" "@vue/server-renderer:${{ matrix.vue }}" "vue:${{ matrix.vue }}"

      - name: List installed peer versions
        run: npm ls --depth=0 @inertiajs/vue3 vue

      - name: Check formatting
        run: npm run format:check

      - name: Check types
        run: npm run types:check

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build
