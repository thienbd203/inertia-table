name: run-js-tests

on:
  workflow_call:
  push:
    branches:
      - '**'
    paths:
      - 'resources/js/**'
      - 'tests-js/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - '.github/workflows/run-js-tests.yml'
  pull_request:
    paths:
      - 'resources/js/**'
      - 'tests-js/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - '.github/workflows/run-js-tests.yml'

concurrency:
  group: run-js-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20.19.0', '22.12.0']

    name: Node ${{ matrix.node }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Setup npm
        run: npm install --global npm@10.9.7 --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check formatting
        run: npm run format:check

      - name: Check types
        run: npm run types:check

      - name: Run tests
        run: npm test

      - name: Build package
        run: npm run build
